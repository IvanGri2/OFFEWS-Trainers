# Prints the repository's Discussions categories with their ids, for the GISCUS setting in
# tools/build.py. Run it by hand from the Actions tab after Discussions are turned on.
name: Show discussion categories

on:
  workflow_dispatch:

permissions:
  discussions: read

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: List categories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){id discussionCategories(first:20){nodes{id name}}}}' \
            -f o="${GITHUB_REPOSITORY%/*}" -f n="${GITHUB_REPOSITORY#*/}"
